name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # lint-and-typecheck (root of the needs-chain)
  # ==========================================================================
  _lint-and-typecheck-self-hosted:
    name: "Lint & Type Check (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check
        run: npm run typecheck
      - name: Legacy bypass policy gate
        run: npm run gate:legacy-bypass
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  lint-and-typecheck:
    name: Lint & Type Check
    needs: _lint-and-typecheck-self-hosted
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._lint-and-typecheck-self-hosted.outputs.passed }}"
      - name: Checkout
        if: needs._lint-and-typecheck-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: needs._lint-and-typecheck-self-hosted.outputs.passed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: needs._lint-and-typecheck-self-hosted.outputs.passed != 'true'
        run: npm ci || npm install
      - name: Type check
        if: needs._lint-and-typecheck-self-hosted.outputs.passed != 'true'
        run: npm run typecheck
      - name: Legacy bypass policy gate
        if: needs._lint-and-typecheck-self-hosted.outputs.passed != 'true'
        run: npm run gate:legacy-bypass

  # ==========================================================================
  # global_install_contract (needs lint-and-typecheck)
  # ==========================================================================
  _global_install_contract-self-hosted:
    name: "Global Install Contract (self-hosted)"
    needs: _lint-and-typecheck-self-hosted
    if: always() && needs._lint-and-typecheck-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Global install contract gate
        run: npm run gate:global-install-contract
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  global_install_contract:
    name: Global Install Contract
    needs: [lint-and-typecheck, _global_install_contract-self-hosted]
    if: always() && needs.lint-and-typecheck.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._global_install_contract-self-hosted.outputs.passed }}"
      - name: Checkout
        if: needs._global_install_contract-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: needs._global_install_contract-self-hosted.outputs.passed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: needs._global_install_contract-self-hosted.outputs.passed != 'true'
        run: npm ci || npm install
      - name: Global install contract gate
        if: needs._global_install_contract-self-hosted.outputs.passed != 'true'
        run: npm run gate:global-install-contract

  # ==========================================================================
  # test (needs lint-and-typecheck)
  # ==========================================================================
  _test-self-hosted:
    name: "Test (Node 20) (self-hosted)"
    needs: _lint-and-typecheck-self-hosted
    if: always() && needs._lint-and-typecheck-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 25
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Smoke tests
        run: npm run test:smoke
      - name: Integration tests
        run: npm run test:integration
      - name: Reliability tests
        run: npm run test:reliability
      - name: Verification framework contracts
        run: npm run test:verification
      - name: Coverage gate (80%+)
        run: npm run test:coverage
      - name: Verify command baseline
        run: npm run verify -- --tier thorough --json
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-self-hosted
          path: coverage/
          retention-days: 14
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Node 20)
    needs: [lint-and-typecheck, _test-self-hosted]
    if: always() && needs.lint-and-typecheck.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._test-self-hosted.outputs.passed }}"
      - name: Checkout
        if: needs._test-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: needs._test-self-hosted.outputs.passed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install dependencies
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm ci || npm install
      - name: Build
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run build
      - name: Smoke tests
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run test:smoke
      - name: Integration tests
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run test:integration
      - name: Reliability tests
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run test:reliability
      - name: Verification framework contracts
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run test:verification
      - name: Coverage gate (80%+)
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run test:coverage
      - name: Verify command baseline
        if: needs._test-self-hosted.outputs.passed != 'true'
        run: npm run verify -- --tier thorough --json
      - name: Upload coverage report
        if: needs._test-self-hosted.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ==========================================================================
  # security (needs lint-and-typecheck)
  # ==========================================================================
  _security-self-hosted:
    name: "Security Audit (self-hosted)"
    needs: _lint-and-typecheck-self-hosted
    if: always() && needs._lint-and-typecheck-self-hosted.outputs.passed == 'true'
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  security:
    name: Security Audit
    needs: [lint-and-typecheck, _security-self-hosted]
    if: always() && needs.lint-and-typecheck.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._security-self-hosted.outputs.passed }}"
      - name: Checkout
        if: needs._security-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: needs._security-self-hosted.outputs.passed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: needs._security-self-hosted.outputs.passed != 'true'
        run: npm ci || npm install
      - name: Audit dependencies
        if: needs._security-self-hosted.outputs.passed != 'true'
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Check for outdated dependencies
        if: needs._security-self-hosted.outputs.passed != 'true'
        run: npm outdated
        continue-on-error: true

  # ==========================================================================
  # pr-validation (pull_request only, no needs)
  # ==========================================================================
  _pr-validation-self-hosted:
    name: "PR Validation (self-hosted)"
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - name: Block PRs targeting main from non-dev branches
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'dev'
        run: |
          echo "::error::Only the 'dev' branch can create PRs targeting 'main'."
          echo "Feature branches must target 'dev'."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|test|chore|ci|security)(\([a-zA-Z0-9_,-]+\))?: .+'
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "PR title does not follow conventional commits format"
            echo "Expected: type: description or type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, test, chore, ci, security"
            exit 1
          fi
          echo "PR title format is correct"
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "$PR_BODY" ]] || [[ "$PR_BODY" == "null" ]]; then
            echo "PR description is empty (recommended but not required)"
          else
            echo "PR description present"
          fi
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  pr-validation:
    name: PR Validation
    needs: _pr-validation-self-hosted
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._pr-validation-self-hosted.outputs.passed }}"
      - name: Block PRs targeting main from non-dev branches
        if: needs._pr-validation-self-hosted.outputs.passed != 'true' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'dev'
        run: |
          echo "::error::Only the 'dev' branch can create PRs targeting 'main'."
          echo "Feature branches must target 'dev'."
          exit 1
      - name: Checkout
        if: needs._pr-validation-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title
        if: needs._pr-validation-self-hosted.outputs.passed != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|test|chore|ci|security)(\([a-zA-Z0-9_,-]+\))?: .+'
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "PR title does not follow conventional commits format"
            echo "Expected: type: description or type(scope): description"
            echo "Types: feat, fix, docs, style, refactor, test, chore, ci, security"
            exit 1
          fi
          echo "PR title format is correct"
      - name: Check PR description
        if: needs._pr-validation-self-hosted.outputs.passed != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "$PR_BODY" ]] || [[ "$PR_BODY" == "null" ]]; then
            echo "PR description is empty (recommended but not required)"
          else
            echo "PR description present"
          fi
